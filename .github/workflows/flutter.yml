name: flutter

on:
  pull_request:
    paths: ['customer_app/**', 'restaurant_app/**', 'packages/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/flutter.yml']
  push:
    branches: [main]
    paths: ['customer_app/**', 'restaurant_app/**', 'packages/**', 'pubspec.yaml', 'pubspec.lock', '.github/workflows/flutter.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [packages/shared_ui, restaurant_app, customer_app]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      # Pub workspace: one resolution for every package (root pubspec.yaml).
      - run: flutter pub get
      - name: Format (140 columns)
        working-directory: ${{ matrix.package }}
        run: dart format -l 140 --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze
      - name: Test
        working-directory: ${{ matrix.package }}
        run: flutter test

  # TODO(phase1): build Android/iOS artifacts and upload to Firebase App Distribution / TestFlight.
